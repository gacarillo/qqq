    ref: [R25]
    faixa_validada_espessura: {min: 30.0, max: 2000.0, unidade: nm, ref: [R25], etiqueta: P}
    faixa_validada_T: {min: 700.0, max: 1300.0, unidade: C, ref: [R25], etiqueta: P}
    B_seco:
      C:  {valor: null, unidade: um^2/h, etiqueta: I, valor_provisorio: 772.0}
      Ea: {valor: null, unidade: eV,     etiqueta: I, valor_provisorio: 1.23}
    B_sobre_A_seco_111:
      C:  {valor: null, unidade: um/h,   etiqueta: I, valor_provisorio: 6.23e6}
      Ea: {valor: null, unidade: eV,     etiqueta: I, valor_provisorio: 2.0}
    razao_111_100: {valor: null, unidade: adim, etiqueta: I, valor_provisorio: 1.68}
    nota: "valores provisorios lembrados; a fonte preferida para Si(100) seco 800 a 1000 C e N14 (Massoud, Plummer, Irene, JES 132, 1745), ainda sem DOI conferido"
  massoud_regime_fino:
    ref: [R26, R27, R28]
    forma: "dx/dt = B/(2x+A) + C exp(-x/L)  (R26); ou dois termos exponenciais no tempo (R28)"
    C: {valor: null, unidade: nm/min, etiqueta: I}
    Ea_C: {valor: null, unidade: eV, etiqueta: I}
    L: {valor: null, unidade: nm, etiqueta: I, nota: "ordem de 7 nm segundo literatura secundaria [I]; conferir"}
  oxidacao_acelerada_dopagem:
    ramos: [ho_plummer, uematsu]
    ho_plummer: {ref: [R29], parametros: null, etiqueta: I}
    uematsu:    {ref: [R30], parametros: null, etiqueta: I}
    nomura_fator_max_implantado: {valor: 2.1, unidade: adim, ref: [R23], etiqueta: P,
                                  condicao: "P+, Sb+, Sn+, Ar+ com dose > 5e14; efeito quimico"}
    massoud_redistribuicao_reversa: {valor: true, ref: [N10], etiqueta: P,
                                  nota: "no inicio da oxidacao seca P acumula, ativo cai e taxa se iguala a Si leve"}
  segregacao_P:
    coef_segregacao_m:
      valor: null
      limite_inferior: 1000.0
      faixa_T_C: [1000, 1100]
      unidade: adim
      ref: [R17]
      etiqueta: P
      nota: "m = C_Si / C_SiO2; so limite inferior no resumo; abaixo de 1000 C extrapolacao [I]"
    coef_transporte_h_1100C: {valor: 5.0, unidade: um/min, ref: [R17], etiqueta: P}
    m_dependente_do_tempo: {valor: true, ref: [R21, R21b], etiqueta: P}
    camada_no_oxido: {valor: 2.0e21, unidade: cm^-3, faixa_T_C: [850, 1000], ref: [R32], etiqueta: P}
    saturacao_pileup_espessura: {valor: 5.0, unidade: nm, ref: [N12], etiqueta: P, nota: "~50 A da interface"}
  ramos_interface:
    acumulo_classico:  {ref: [R16, R17, R32], etiqueta: P}
    retrogrado_horzel: {ref: [R20], etiqueta: P, espessura_retrograda_nm: {min: 10.0, max: 20.0},
                        nota: "medido apos difusao POCl3, nao implantacao"}
    quimico_acumula_ativo_depleta: {ref: [N20], etiqueta: P,
                        nota: "Nicollian e Chatterjee; P ativo erfc crescente para o volume"}
    lado_do_pileup:
      oxido: {ref: [N21, N21b], etiqueta: P}
      silicio_inativo: {ref: [N22], etiqueta: P, nota: "ativo no lado Si cai a ~60 %"}

