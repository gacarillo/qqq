# params.yaml do gfetsim
#
# Arquivo unico de parametros fisicos e de processo.
# Cada parametro tem valor, unidade, incerteza, referencias (IDs da tabela em
# docs/referencias.md) e etiqueta de origem.
#
# Etiquetas
#   P  valor publicado e verificado (no resumo ou em texto conferido)
#   C  calculo proprio a partir de valores [P]
#   I  inferencia sem fonte direta, ou valor lembrado da literatura que NAO foi
#      conferido no texto original (ver pendencias.md)
#   B  convencao de bancada ou dado da receita fornecido pelo usuario
#
# Incerteza
#   {tipo: normal, sigma}            desvio padrao absoluto, na unidade do valor
#   {tipo: normal_rel, sigma_rel}    desvio padrao relativo
#   {tipo: uniforme, min, max}
#   {tipo: loguniforme, min, max}
#   {tipo: varredura, min, max}      parametro de entrada, nao amostrado no MC
#   null                             tratado como exato
#
# Valores null significam que o numero ainda nao foi obtido de fonte confiavel.
# O codigo deve recusar rodar um modelo que dependa de um valor null, a menos
# que o usuario forneca o valor ou aceite explicitamente o valor_provisorio [I].
#
# Ramos (alternativas) que a literatura nao resolve ficam em "ramos" e sao
# propagados separadamente, nunca misturados numa media.

meta:
  versao_esquema: 1
  conferencia_referencias: docs/referencias.md
  notas_de_conferencia: docs/notas_conferencia.md
  pendencias: pendencias.md
  limitacao_da_conferencia: >
    A rede desta sessao bloqueia Crossref, doi.org e as editoras. A conferencia
    foi feita pelo indice SciSpace (DOI, autores, revista, resumo) e pelo
    bibcode ADS. Numeros que so existem no texto completo ficaram [I] ou null.
  fontes_secundarias: >
    Alguns valores [P] foram lidos em fontes secundarias abertas (teses da TU Wien,
    artigos do arXiv) que tabelam os numeros e citam a fonte primaria. Nesses casos
    o campo conferido_em diz onde o numero foi lido, e a fonte primaria continua
    listada em ref. O numero e [P] porque foi lido em texto publicado, mas a
    transcricao entre a fonte primaria e a secundaria nao foi conferida.
    S1 Filipovic L., dissertacao TU Wien, iue.tuwien.ac.at/phd/filipovic (tabelas 2.2 a 2.4)
    S2 Radi M., dissertacao TU Wien, iue.tuwien.ac.at/phd/radi/node23.html (eq. 2.38 a 2.42)
    D1 Das A. et al., Nat. Nanotechnol. 3, 210 (2008), 10.1038/nnano.2008.67, texto aberto arXiv 0709.1174
    ART artigo do usuario (Carillo, Teixeira, Pereyra), dados de bancada [B]

# ---------------------------------------------------------------------------
# Constantes fisicas
# ---------------------------------------------------------------------------
constantes:
  fonte: "CODATA 2018 via scipy.constants (DOI do CODATA a conferir, ver pendencias)"
  q:      {valor: 1.602176634e-19, unidade: C,      incerteza: null, etiqueta: P}
  k_B:    {valor: 1.380649e-23,    unidade: J/K,    incerteza: null, etiqueta: P}
  eps0:   {valor: 8.8541878128e-12, unidade: F/m,   incerteza: null, etiqueta: P}
  h:      {valor: 6.62607015e-34,  unidade: J*s,    incerteza: null, etiqueta: P}
  m0:     {valor: 9.1093837015e-31, unidade: kg,    incerteza: null, etiqueta: P}

# ---------------------------------------------------------------------------
# Receita de processo (entradas)
# ---------------------------------------------------------------------------
receita:
  substrato:
    tipo:          {valor: n, etiqueta: B}
    orientacao:    {valor: "(100)", etiqueta: B}
    resistividade: {valor: null, unidade: ohm*cm, incerteza: {tipo: varredura, min: 0.001, max: 10.0}, etiqueta: B,
                    nota: "desconhecida; varrer de 0,001 a 10 ohm cm"}
    dopante_fundo: {valor: null, etiqueta: B, nota: "P ou As ou Sb? pendente; afeta Masetti e Fermi"}

  implantacao:
    ion:            {valor: P, carga: 1, etiqueta: B}
    energia:        {valor: 30.0, unidade: keV, incerteza: {tipo: normal_rel, sigma_rel: 0.01}, etiqueta: B,
                     nota: "incerteza de 1 % e [I], convencao de implantador; confirmar com o operador"}
    dose:           {valor: 3.0e15, unidade: cm^-2, incerteza: {tipo: normal_rel, sigma_rel: 0.05}, etiqueta: B,
                     nota: "incerteza de 5 % e [I]; integrador de corrente e eletrons secundarios"}
    inclinacao:     {valor: 7.0, unidade: grau, incerteza: {tipo: normal, sigma: 0.5}, etiqueta: B,
                     nota: "sigma 0,5 grau e [I]"}
    rotacao_twist:  {valor: null, unidade: grau, etiqueta: B,
                     nota: "NAO informado; decide canalizacao planar (110) a 7 graus (ver N1 Ghante)"}
    temperatura:    {valor: 25.0, unidade: C, incerteza: {tipo: uniforme, min: 20.0, max: 80.0}, etiqueta: B,
                     nota: "ambiente; limite superior [I] por aquecimento do feixe"}
    densidade_corrente: {valor: null, unidade: uA/cm^2, etiqueta: B,
                     nota: "afeta autorrecozimento e amorfizacao (Berti et al. pss(a) 97, 77 (1986))"}
    variantes:
      A_mascara:  {oxido_mascara_nm: 150.0, janela: true,  etiqueta: B}
      B_lamina:   {oxido_mascara_nm: 0.0,   janela: false, etiqueta: B}
    oxido_nativo:   {valor: 1.5, unidade: nm, incerteza: {tipo: uniforme, min: 0.5, max: 2.5}, etiqueta: I,
                     nota: "nao informado se ha HF antes da implantacao"}

  recozimento:
    spe:
      temperatura: {valor: 550.0, unidade: C, incerteza: {tipo: normal, sigma: 5.0}, etiqueta: B}
      tempo:       {valor: 30.0, unidade: min, incerteza: null, etiqueta: B}
      ambiente:    {valor: N2, etiqueta: I, nota: "ambiente da etapa de 550 C nao informado"}
    variante_A_rta:
      temperatura: {valor: 1050.0, unidade: C, incerteza: {tipo: normal, sigma: 10.0}, etiqueta: B,
                    nota: "sigma de pirometro [I]"}
      tempo:       {valor: 10.0, unidade: s, incerteza: null, etiqueta: B}
      rampa_subida:  {valor: null, unidade: C/s, etiqueta: B, nota: "pendente; contribui ao orcamento termico"}
      rampa_descida: {valor: null, unidade: C/s, etiqueta: B, nota: "pendente"}
    variante_B_forno:
      temperatura: {valor: null, unidade: C, incerteza: {tipo: varredura, min: 850.0, max: 900.0}, etiqueta: B}
      tempo:       {valor: 30.0, unidade: min, incerteza: null, etiqueta: B}
      ambiente:    {valor: N2, etiqueta: B}
      rampa:       {valor: null, unidade: C/min, etiqueta: B, nota: "entrada e saida do forno pendentes"}

  oxidacao_porta:
    ambiente:      {valor: O2_seco, etiqueta: B}
    espessura_alvo: {valor: 20.0, unidade: nm, etiqueta: B}
    temperatura:   {valor: null, unidade: C, incerteza: {tipo: varredura, min: 800.0, max: 1000.0}, etiqueta: B,
                    nota: "entrada; a faixa 800 a 1000 C e a faixa dos dados de Massoud (R26 a R28)"}
    tempo:         {valor: null, unidade: min, incerteza: {tipo: varredura, min: 1.0, max: 600.0}, etiqueta: B}
    consumo_si_por_oxido: {valor: 0.44, unidade: nm/nm, incerteza: null, etiqueta: B,
                    nota: "fornecido pelo usuario"}
    pressao_O2:    {valor: 1.0, unidade: atm, incerteza: null, etiqueta: B}
    cloro:         {valor: false, etiqueta: B, nota: "sem HCl ou TCA, confirmar"}
    metodo:        {valor: termico, opcoes: [termico, sputtering], etiqueta: B,
                    nota: "o artigo do usuario (ART) calibra a alternativa por sputtering RF reativo"}
    sputtering:
      ref: [ART]
      inclinacao_taxa_potencia: {valor: 0.088, unidade: nm/(min*W), ic95: [0.072, 0.104], etiqueta: B,
                                 nota: "ajuste linear da elipsometria, 4 niveis de potencia, 5 mTorr"}
      tempo_20nm_50W: {valor: 5.1, unidade: min, ic95: [4.6, 5.9], ip95: [4.1, 6.9], etiqueta: B}
      indice_refracao: {valor: 1.464, incerteza: {tipo: normal, sigma: 0.008}, etiqueta: B}
      consome_si: {valor: false, etiqueta: B, nota: "oxido depositado nao consome Si nem segrega P"}
      eps_r: {valor: null, etiqueta: I, nota: "permissividade estatica do oxido depositado nao medida; usar a do SiO2 termico com incerteza maior"}
      eps_r_sigma_rel_extra: {valor: 0.05, etiqueta: I,
                              nota: "densidade relativa de -1 a +3 % pela Lorentz-Lorenz (ART); 5 % cobre isso com folga"}

  dispositivo:
    grafeno:       {valor: CVD_transferido, etiqueta: B}
    metodo_transferencia: {valor: umido_PMMA_reagente_Marble, ref: [ART], etiqueta: B,
                    nota: "PMMA 4,9 % em acetona, recozimento final 170 C por 30 min ou mais (ART secao 2.4)"}
    largura_canal: {valor: null, unidade: um, etiqueta: B}
    comprimento_canal: {valor: null, unidade: um, etiqueta: B}
    metal_contato: {valor: null, etiqueta: B}

# ---------------------------------------------------------------------------
# Modulo 1  Implantacao
# ---------------------------------------------------------------------------
implantacao:
  rustbca:
    n_ions_minimo: {valor: 100000, etiqueta: B}
    validacao_previa_P_100keV:
      Rp_rustbca: {valor: 135.0, unidade: nm, etiqueta: B, nota: "resultado do usuario"}
      Rp_referencia: {valor: 133.0, unidade: nm, etiqueta: B, ref: [R5],
                      nota: "Lie et al.; numero NAO conferido (R5 nao encontrado); possivel que seja em GeSi"}
    boro_invalido: {valor: true, etiqueta: B, nota: "398 nm contra 297 nm; nao usar para B"}
    binario: {valor: /opt/ext/RustBCA/target/release/RustBCA, etiqueta: B,
              nota: "compilado de github.com/lcpp-org/RustBCA, commit a356280; pode ser trocado pela variavel GFETSIM_RUSTBCA"}
    potencial: {valor: KR_C, etiqueta: B, nota: "Kr-C, padrao dos exemplos do RustBCA"}
    parada_eletronica: {valor: LOW_ENERGY_NONLOCAL, etiqueta: B, nota: "Lindhard-Scharff, padrao do RustBCA"}
    Si: {Z: 14, m: 28.0855, densidade_at_cm3: 4.996e22, Eb: 0.0, Es: 4.72, Ec: 1.5, etiqueta: B,
         nota: "valores do exemplo layered_geometry do RustBCA; Es e a energia de ligacao de superficie"}
    SiO2: {densidade_O_cm3: 4.6e22, densidade_Si_cm3: 2.3e22, etiqueta: I,
           nota: "2,2 g/cm3 de silica; estequiometria 1:2; densidade nao conferida em fonte primaria"}
  validacao:
    alcance_grant:
      ref: [G1]
      forma: "rho_p = 1,75 eps^(2/3), valida para 0,02 < eps < 0,5 (reduzidas de LSS)"
      coeficiente: {valor: 1.75, etiqueta: P}
      expoente: {valor: 0.6667, etiqueta: P}
      faixa_eps: {min: 0.02, max: 0.5, etiqueta: P}
      nota: "Grant, Williams e Dodds, 10.1007/978-1-4615-8876-4_19, so o resumo. Definicoes de eps e rho de LSS sao [C]. A 30 keV P em Si eps ~ 0,6, fora da faixa; o teste usa 15 e 20 keV"
    kobayashi_gibson: {ref: [K1], etiqueta: P,
      nota: "P em Si 5 a 80 keV, 3e14; Rp e dRp medidos por NRA concordam com TRIM (10.1016/S0168-583X(99)00182-2)"}

  amorfizacao:
    densidade_energia_critica:
      valor: 6.0e23
      unidade: eV/cm^3
      incerteza: {tipo: normal_rel, sigma_rel: 0.3}
      ref: [A4]
      etiqueta: P
      nota: "do resumo de Dennis e Hale; sigma de 30 % e [I]; criterio sobre energia em processos atomicos"
    dose_limiar_ions_massa_proxima_Si:
      valor: null
      faixa: {min: 1.0e15, max: 3.0e15}
      unidade: cm^-2
      ref: [A2]
      etiqueta: P
      nota: "Si+ 10 a 60 keV a 300 K; P+ 'valores similares' (resumo)"
    observacao_P_30keV_1e16_amorfo: {valor: true, ref: [A3], etiqueta: P}
    criterio_vale_a_baixa_T: {valor: true, ref: [A4, A6], etiqueta: P,
      nota: "A6 (Narayan et al., JVST 2, 1303, 10.1116/1.572399) da 6,0e23 eV/cm3 = 12 eV/atomo a 4 K sem recozimento. A4 diz que a TA a difusao da energia do dano muda o limiar"}
    falha_validacao_criterio_baixa_T: {etiqueta: C,
      nota: "com o RustBCA, 6e23 eV/cm3 preve limiar de 1,1e14 a 1,7e14 cm-2 para P 10 a 60 keV, dez vezes abaixo do medido a 300 K (A2). Por isso o modelo usa o limiar de dose medido a TA (ramo limiar_TA)"}
    ramos: [limiar_TA, energia_critica_baixa_T]
    limiar_TA:
      dose_limiar: {valor: null, incerteza: {tipo: uniforme, min: 1.0e15, max: 3.0e15}, unidade: cm^-2, ref: [A2, A5], etiqueta: P,
        nota: "A2 da 1 a 3e15 para Si+ e diz que P e similar; A5 ve camada amorfa com P 1e15 de 25 a 180 keV. Regiao amorfa onde Fn(x) >= Fn_max * dose_limiar / dose [C]; a fracao de energia atomica se cancela"}
    limiar_P_30keV_especifico: {valor: null, ref: [A1], etiqueta: P,
                                nota: "Eklund e Andersson medem exatamente P 30 keV; numero so no texto"}
    fracao_energia_atomica:
      valor: null
      valor_provisorio: 0.85
      incerteza: {tipo: uniforme, min: 0.7, max: 1.0}
      etiqueta: I
      nota: "o RustBCA registra so a perda nuclear do ion incidente; parte da energia dos recuos vai para excitacao eletronica. Fracao [I] ate usar uma particao publicada"

  canalizacao:
    ramo_imsil: {disponivel: false, ref: [R1], etiqueta: B, nota: "licenca com G. Hobler pendente"}
    cauda_exponencial:
      comprimento_decaimento: {valor: null, unidade: nm, ref: [R2, R3, R4, N1], etiqueta: I,
                               nota: "ajustar a SIMS digitalizado; nenhum numero nos resumos"}
      fracao_canalizada:      {valor: null, ref: [R2, R4, N3], etiqueta: I,
                               nota: "diminui com a dose por descanalizacao (R2, N3)"}
    sete_graus_nao_evita_canalizacao_axial: {valor: true, ref: [R4], etiqueta: P,
                               nota: "P 80 a 150 keV, 2e14 a 2e15; nossa energia e menor"}
    canalizacao_planar_110_a_5_graus: {valor: true, ref: [N1], etiqueta: P}

# ---------------------------------------------------------------------------
# Modulo 2  Recozimento
# ---------------------------------------------------------------------------
recozimento:
  silicio:
    ni_T:
      forma: "ni = A T^1.5 exp(-Eg_eff / 2kT)"
      A:      {valor: null, unidade: cm^-3 K^-1.5, etiqueta: I, valor_provisorio: 3.87e16,
               nota: "valor usual em simuladores de processo; fonte original nao conferida"}
      Eg_eff: {valor: null, unidade: eV, etiqueta: I, valor_provisorio: 1.21,
               nota: "corresponde a 0,605 eV no expoente; nao conferido"}
    ni_300K: {valor: 9.65e9, unidade: cm^-3, ref: [N25], etiqueta: P,
              nota: "N25 Altermatt et al., JAP 93, 1598, 10.1063/1.1529297; concorda com Misiakos e Tsamakis (9,7e9)"}
    ni_candidato_couderc: {ref: [N26], etiqueta: P,
              nota: "N26 Couderc et al., JAP 115, 093705, 10.1063/1.4867776: ni = 1,541e15 T^1,712 exp(-Eg0/2kT); Eg0 e faixa de validade nao lidos"}

  difusao_P:
    modelo_padrao: fair_tsai
    ramos: [fair_tsai, mathiot_pfister]
    fair_tsai:
      ref: [R6]
      nota: "tres difusividades intrinsecas (P com V0, V-, V=); fator de cauda ate 135 a 900 C (resumo)"
      D0_neutro:   {valor: null, unidade: cm^2/s, etiqueta: I, valor_provisorio: 3.85}
      Ea_neutro:   {valor: null, unidade: eV,     etiqueta: I, valor_provisorio: 3.66}
      D0_menos:    {valor: null, unidade: cm^2/s, etiqueta: I, valor_provisorio: 4.44}
      Ea_menos:    {valor: null, unidade: eV,     etiqueta: I, valor_provisorio: 4.00}
      D0_duplo:    {valor: null, unidade: cm^2/s, etiqueta: I, valor_provisorio: 44.2}
      Ea_duplo:    {valor: null, unidade: eV,     etiqueta: I, valor_provisorio: 4.37}
      fator_cauda_max_900C: {valor: 135.0, unidade: adim, ref: [R6], etiqueta: P}
      nota_valores: "valores provisorios lembrados de implementacoes do modelo; conferir no texto de R6"
    mathiot_pfister:
      ref: [R7, R7b, R7c]
      nota: "o DOI de R7 aponta para a critica numerica a Fair-Tsai; o modelo de percolacao esta em R7b e R7c"
      parametros: {valor: null, etiqueta: I}

  ted:
    fator_mais_n:
      valor: null
      faixa: {min: 1.0, max: 4.0}
      unidade: adim
      ref: [R8, N7]
      etiqueta: P
      nota: "R8 da maximo ~4 para As 1 keV; valor para P 30 keV 3e15 so no texto. R8 e Hobler-Moroz valem para implante NAO amorfizante"
    camada_amorfa_varre_intersticiais: {valor: true, ref: [N8], etiqueta: P}
    dissolucao_311_Ea: {valor: 3.8, unidade: eV, incerteza: {tipo: normal, sigma: 0.2}, ref: [R10], etiqueta: P}
    recombinacao_superficie:
      ramos:
        lim:      {valor: 100.0, unidade: nm, temperatura_C: 800, ref: [R9], etiqueta: P}
        agarwal:  {valor: 10.0,  unidade: nm, tipo_limite: superior, temperaturas_C: [810, 950, 1050], ref: [N5], etiqueta: P}
        lamrani:  {valor: 200.0, unidade: nm, tipo_limite: superior, temperatura_C: 850, ref: [N5b], etiqueta: P}
      nota: "discordancia de uma ordem de grandeza; Law et al. (N5c) discutem a origem"

  spe_550C:
    Ea_velocidade_spe: {valor: 2.7, unidade: eV, incerteza: {tipo: normal, sigma: 0.2}, ref: [N9], etiqueta: P,
                        nota: "medido em RTA 475 a 600 C, com fator de aceleracao 4 frente a forno"}
    prefator_velocidade: {valor: null, unidade: cm/s, etiqueta: I, valor_provisorio: 3.07e8,
                          nota: "valor de Olson e Roth lembrado, com Ea 2,68 eV, para Si(100) intrinseco; nao conferido"}
    fator_aceleracao_P: {valor: null, etiqueta: I, valor_provisorio: 1.0,
                          incerteza: {tipo: loguniforme, min: 1.0, max: 6.0},
                          nota: "P acelera a SPE em altas concentracoes; faixa [I] sem fonte conferida"}
    ativacao_apos_550C:
      valor: null
      ref: [R14, R13]
      etiqueta: I
      nota: "R14 diz que P atinge ativacao maxima a 550 C, sem numero no resumo"

  ativacao_dados_validacao:
    yu_dois_passos: {faixa: {min: 0.75, max: 1.00}, unidade: fracao, ref: [R13], etiqueta: P,
                     condicao: "P 50 e 100 keV; 550 C 30 min + 1050 C 10 s"}
    yu_um_passo:    {faixa: {min: 0.40, max: 0.60}, unidade: fracao, ref: [R13], etiqueta: P,
                     condicao: "so 1050 C 10 s"}
    li_han_850C:    {valor: 0.67, unidade: fracao, ref: [R19], etiqueta: P,
                     condicao: "P 55 keV 3e15; maximo na serie de T"}
    shannon_650C:   {valor: 5.0e20, unidade: cm^-3, ref: [R18], etiqueta: P, condicao: "40 e 100 keV, implante a TA"}
    shannon_850C:   {valor: 1.5e21, unidade: cm^-3, ref: [R18], etiqueta: P,
                     nota: "eletrons livres; DISCORDA da solubilidade de equilibrio de Nobili"}

  solubilidade_P:
    ref: [R15, N24]
    forma: "n_e(T) = A_ne exp(-Ea_ne/kT) ativo em equilibrio; C_sat(T) = A_sat exp(-Ea_sat/kT) total em equilibrio com SiP"
    A_ne:   {valor: 1.3e22, unidade: cm^-3, ref: [N24], etiqueta: P}
    Ea_ne:  {valor: 0.37,   unidade: eV,    ref: [N24], etiqueta: P}
    A_sat:  {valor: 2.45e23, unidade: cm^-3, ref: [N24], etiqueta: P}
    Ea_sat: {valor: 0.62,   unidade: eV,    ref: [N24], etiqueta: P}
    nota: "N24 Solmi, Parisini, Angelucci, Armigliato, Nobili, Moro, PRB 53, 7836, 10.1103/PhysRevB.53.7836 (resumo). n_e medido em polissilicio; C_sat de 800 a 1000 C. Para T > 750 C, C_sat > n_e e a diferenca e P inativo movel"
    incerteza_ne: {valor: null, incerteza: {tipo: normal_rel, sigma_rel: 0.15}, etiqueta: I,
                   nota: "o resumo nao da incerteza; 15 % [I] cobre a diferenca de 5 % contra o valor que arXiv 1905.10667 atribui a Solmi a 890 C (3,42e20)"}
    valor_900C_antigo: {valor: null, unidade: cm^-3, incerteza: {tipo: loguniforme, min: 1.0e20, max: 5.0e20}, etiqueta: I,
                 nota: "faixa anterior, mantida so como referencia; N24 da 3,4e20 a 900 C, dentro dela"}
    mobilidade_independe_de_P_inativo: {valor: true, ref: [N4], etiqueta: P}
    discordancia_shannon: {etiqueta: C,
      nota: "R18 mede 1,5e21 eletrons apos 850 C; N24 da 2,8e20. O ramo metaestavel (sem desativacao) cobre o lado de R18"}

  desativacao:
    ref: [R12, R12b]
    inicio_P: {valor: 500.0, unidade: C, ref: [R12], etiqueta: P, nota: "P desativa a partir de ~500 C"}
