      tau2_0: {valor: 2.71e-7, unidade: min,      etiqueta: P, conferido_em: S1}
      E_tau2: {valor: 1.88,    unidade: eV,       etiqueta: P, conferido_em: S1}
    sinal_tau: {valor: "+", etiqueta: C,
      nota: "S1 escreve tau = tau0 exp(-E/kT), o que da tau de 1e-12 min a 900 C. Com exp(+E/kT) tau1 fica em minutos e decresce com T, como o efeito fisico exige. Usamos +E/kT [C]"}
