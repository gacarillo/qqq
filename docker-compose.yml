version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bolao_postgres
    environment:
      POSTGRES_DB: bolao_copa
      POSTGRES_USER: bolao_user
      POSTGRES_PASSWORD: bolao_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolao_user -d bolao_copa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolao_backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://bolao_user:bolao_pass@postgres:5432/bolao_copa
      JWT_SECRET: change_this_in_production_32chars_min
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npm run db:setup && npm run db:seed && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bolao_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3001

volumes:
  postgres_data:
