<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Feira Sort</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <meta name="theme-color" content="#2c6fbb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Permanent+Marker&display=swap"
    />
  </head>
  <body>
    <div id="jogo">
      <canvas id="tela" aria-label="Tabuleiro: toque numa caixa e depois em outra para mover as frutas"></canvas>

      <header id="topo">
        <div class="topo-linha">
          <div class="plaquinha" id="rotulo-fase">Fase 1</div>
          <div class="topo-direita">
            <div class="moedas" id="moedas" aria-label="Moedas">
              <span class="moeda" aria-hidden="true"></span><span id="moedas-valor">0</span>
            </div>
            <button class="botao-redondo" id="botao-album" aria-label="Abrir o álbum">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v12c0 .8-.7 1.5-1.5 1.5H13z" /></svg>
            </button>
            <button class="botao-redondo" id="botao-menu" aria-label="Ajustes">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
            </button>
          </div>
        </div>
        <div class="varal" id="varal">
          <button class="figurinha-mini" id="figurinha-mini" aria-label="Figurinha em andamento"></button>
          <div class="varal-texto">
            <strong id="figurinha-titulo">Figurinha 1 de 16</strong>
            <span id="figurinha-pecas">0 de 8 peças</span>
          </div>
        </div>
      </header>

      <main id="area-tabuleiro" aria-hidden="true"></main>

      <nav id="acoes" aria-label="Ajudas">
        <button class="acao" id="botao-desfazer">
          <span class="acao-icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg></span>
          <span class="acao-nome">Desfazer</span>
          <b class="selo" id="selo-desfazer">5</b>
        </button>
        <button class="acao" id="botao-caixa">
          <span class="acao-icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2" /><path d="M4 11h16M12 2v6M9 5h6" /></svg></span>
          <span class="acao-nome">Caixa extra</span>
          <b class="selo selo-anuncio" id="selo-caixa">▶</b>
        </button>
        <button class="acao" id="botao-reiniciar">
          <span class="acao-icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2" /><path d="M4 4v5h5" /></svg></span>
          <span class="acao-nome">Reiniciar</span>
        </button>
      </nav>

      <div class="aviso" id="aviso" role="status" hidden></div>
      <canvas id="efeitos" aria-hidden="true"></canvas>
      <div class="mao" id="mao" hidden aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v17l2-1c3-1 6 0 7 3l1 1c3-1 6 1 7 4 3-1 6 1 6 4v9c0 9-6 14-15 14h-5c-5 0-9-2-12-6l-9-12c-2-3-1-6 2-7 2-1 5 0 6 2l2 3V11c0-3 2-5 5-5z" fill="#fff" stroke="#3a2416" stroke-width="3" stroke-linejoin="round" /></svg>
      </div>
      <div class="camada-modal" id="camada-modal" hidden>
        <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
      </div>
    </div>
    <script type="module" src="/src/jogo/main.ts"></script>
  </body>
</html>
